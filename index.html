<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой дневник — главная</title>
  <!-- Лаб 3: подключите стили -->
  <!-- <link rel="stylesheet" href="css/style.css"> -->
</head>
<body>

  <!-- Лаб 2: семантическая структура страницы -->
  <header>
    <h1>Мой дневник</h1>
    <nav>
      <!-- Ссылки на страницы: главная, о блоге -->
    </nav>
  </header>

  <main>
    <section>
      <h2>Последние записи</h2>
      <!--
        С лаб 4–6: список записей формируется динамически (массив JS / fetch).
        До этого — статические <article> для примера.
      -->
      <article>
        <h3>Заголовок записи</h3>
        <p>Краткое содержание записи.</p>
        <time datetime="2026-09-01">1 сентября 2026</time>
      </article>
    </section>

    <aside>
      <h2>Категории</h2>
      <!-- Список-ссылки категорий -->
    </aside>
  </main>

  <footer>
    <p>© <span id="year"></span> Мой дневник</p>
    <!-- Лаб 4: год подставляется из JS -->
  </footer>

  <!-- Лаб 4–5: сценарий страницы -->
  <!-- <script src="js/main.js" defer></script> -->
</body>
</html>
