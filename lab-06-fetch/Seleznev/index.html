<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="stylesheet" href="css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой дневник — главная</title>
</head>
<body>
  <header>
    <h1>Мой дневник</h1>
    <nav>
       <a href="index.html">Главная</a>
       <a href="about.html">О блоге</a>
    </nav>
  </header>
  <div class="layout">

  <main>
    <h2>Последние записи</h2>
    <div id="posts"></div>
    <section>
        <h2>Новая запись</h2>
        <form id="add-post" novalidate>
        <div class="frm-row">
            <label for="title">Заголовок</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Название публикации"
            >
        </div>

        <div class="frm-row">
            <label for="category">Категория</label>
            <select id="category" name="category">
                <option value="">Выберите категорию</option>
            </select>
        </div>

        <div class="frm-row">
            <label for="content">Текст записи</label>
            <textarea
                id="content"
                name="content"
                rows="6"
                placeholder="Расскажите, что вы изучили..."
            ></textarea>
        </div>

        <button type="submit" class="btn">Добавить запись</button>
    </form>
    </section>
  </main>

  <aside>
    <h2>Категории</h2>
    <ul>
      <li><a href="#">Учеба</a></li>
      <li><a href="#">Проекты</a></li>
      <li><a href="#">Технологии</a></li>
    </ul>
  </aside>
  </div>

  <footer>
    <p>© <span id="year">2026</span> Мой дневник</p>
  </footer>
<script src="js/main.js" defer></script>
</body>
</html>
